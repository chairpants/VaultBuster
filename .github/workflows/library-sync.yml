# Twice a day, rebuilds catalog.js (the store's stock) from VaultVision: picks
# up whatever the library has added, and leaves out whatever its own scheduled
# check has found dead on archive.org (library-health.json in that repo;
# nothing here talks to archive.org). Runs half an hour after that check. A
# rebuild that changes nothing commits nothing.
#
# Covers aren't part of this: covers.js needs a TMDB key (fetch-covers.mjs), so
# a newly added show is stocked without a cover until that's run by hand.
name: Library sync

on:
  schedule:
    - cron: "47 5,17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Accept a rebuild that loses more than 10% of the tapes (only after looking at why)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the rebuilt catalog
  actions: write    # keep the schedule alive
  pages: write      # ask for the site to be rebuilt

concurrency:
  group: library-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # what build.mjs reads: the show list, each show's data.js, the library
      # check's record, and the posters (it checks each one exists)
      - name: Fetch the VaultVision library
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/chairpants/VaultVision.git ../VaultVision
          git -C ../VaultVision sparse-checkout set --no-cone /shows.js /library-health.json '/shows/*/data.js' '/art/*'

      - name: Rebuild the catalog
        id: sync
        env:
          REQUIRE_LIBRARY_HEALTH: "1"
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          cp catalog.js "$RUNNER_TEMP/catalog-before.js"
          node build.mjs ../VaultVision
          if cmp -s catalog.js "$RUNNER_TEMP/catalog-before.js"; then
            echo "library sync: no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A catalog that shrinks a lot in one go is a broken upstream or a bad
          # scan far more often than it's real: stop, and let a person look.
          node - "$RUNNER_TEMP/catalog-before.js" catalog.js <<'JS'
          const fs = require("fs"), vm = require("vm");
          const load = f => { const w = {}; vm.runInNewContext(fs.readFileSync(f, "utf8"), { window: w }); return w.VAULT_CATALOG; };
          const count = c => c.reduce((n, t) => n + t.seasons[0].episodes.length, 0);
          const [was, now] = process.argv.slice(2).map(load);
          const message = `Library sync: ${now.length} tapes, ${count(now)} episodes (${count(now) - count(was) >= 0 ? "+" : ""}${count(now) - count(was)})`;
          console.log(`${was.length} -> ${now.length} tapes, ${count(was)} -> ${count(now)} episodes`);
          if (count(now) < count(was) * 0.9 && !process.env.FORCE) {
            console.error(`the catalog lost more than 10% of its episodes in one rebuild. Not kept. If it's real, run the workflow by hand with "force" ticked.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=true\nmessage=${message}\n`);
          JS

      - name: Commit the catalog if it changed
        id: commit
        if: steps.sync.outputs.changed == 'true'
        env:
          MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          git add catalog.js
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "$MESSAGE"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The site is served by GitHub Pages straight from this branch. Ask for
      # the build by name, in case a push made by a workflow does not start one.
      - name: Publish the site
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub switches a schedule off after 60 days with no repository
      # activity; re-enabling the workflow resets that clock.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/library-sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
