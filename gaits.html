<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gait Lineup</title>
<!-- Every walking style side by side, numbered, for picking keepers. A throwaway viewer: no store, nothing saved -->
<style>
  body { margin: 0; background: #1d2026; color: #eee; font: 14px Arial, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; background: #000a; padding: 10px 12px; border-radius: 6px; line-height: 1.7; }
  #ui b { color: #ffd400; } label { display: block; } input[type=range] { width: 160px; vertical-align: middle; }
  #ui button { margin-right: 4px; }
  .tag { position: fixed; transform: translate(-50%, -100%); font: bold 15px Arial; color: #fff; background: #0059b3; border: 2px solid #ffd400; border-radius: 4px; padding: 1px 6px; pointer-events: none; white-space: nowrap; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head><body>
<div id="ui">
  <b>GAIT LINEUP</b> — drag to orbit, scroll to zoom<br>
  <label>Speed <input id="spd" type="range" min="0.4" max="3.2" step="0.05" value="1.3"> <span id="spdV"></span> m/s</label>
  <label>Time <input id="ts" type="range" min="0.05" max="1" step="0.05" value="1"> <span id="tsV"></span>×</label>
  <label><input id="same" type="checkbox"> Same outfit on everyone</label>
  <button id="pause">Pause</button><button id="step">Step ⟶</button><button id="side">Side view</button><button id="front">Front view</button>
  <div id="list"></div>
</div>
<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  window.THREE = THREE;
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "customers.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const VC = window.VaultCustomers, NAMES = Object.keys(VC.GAITS);
  const seeded = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio); document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2f38);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445060, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(-6, 10, 4); scene.add(sun);
  const LANE = 1.6, LEN = 10, W = NAMES.length * LANE;
  const grid = new THREE.GridHelper(Math.max(W, LEN) + 6, Math.round((Math.max(W, LEN) + 6) / 0.5), 0x8a93a3, 0x4a515e); scene.add(grid);   // half-metre squares: a skating foot shows against them
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W + 6, LEN + 6), new THREE.MeshLambertMaterial({ color: 0x3a404b })); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002; scene.add(floor);

  const walkers = [];
  function build() {
    for (const w of walkers) { scene.remove(w.c.group); w.tag.remove(); }
    walkers.length = 0;
    const same = document.getElementById("same").checked;
    NAMES.forEach((gait, i) => {
      const o = VC.randomOutfit(seeded(same ? 1985 : 100 + i * 7));
      const c = VC.build({ ...o, gait, height: same ? 1 : o.height, build: same ? 1 : o.build });
      c.group.position.set((i - (NAMES.length - 1) / 2) * LANE, 0, (i % 2 ? 1 : -1) * LEN / 2 * 0.3);
      const tag = document.body.appendChild(Object.assign(document.createElement("div"), { className: "tag", textContent: `${i + 1} · ${gait}` }));
      scene.add(c.group); walkers.push({ c, gait, dir: 1, tag });
    });
    document.getElementById("list").innerHTML = NAMES.map((g, i) => `${i + 1} — ${g}`).join("<br>");
  }
  build();
  document.getElementById("same").onchange = build;

  const view = (side) => { if (side) camera.position.set(W / 2 + 7, 1.6, 0); else camera.position.set(0, 2.6, LEN / 2 + 13); controls.target.set(0, 0.9, 0); controls.update(); };
  view(false);
  document.getElementById("side").onclick = () => view(true);
  document.getElementById("front").onclick = () => view(false);
  let paused = false, stepOnce = false;
  document.getElementById("pause").onclick = e => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
  document.getElementById("step").onclick = () => { paused = true; stepOnce = true; document.getElementById("pause").textContent = "Play"; };
  const spd = document.getElementById("spd"), ts = document.getElementById("ts");
  const show = () => { document.getElementById("spdV").textContent = (+spd.value).toFixed(2); document.getElementById("tsV").textContent = (+ts.value).toFixed(2); };
  spd.oninput = ts.oninput = show; show();

  const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  addEventListener("resize", resize); resize();
  const clock = new THREE.Clock(), v3 = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    let dt = Math.min(clock.getDelta(), 0.05);
    if (paused && !stepOnce) dt = 0; else if (stepOnce) { dt = 1 / 60; stepOnce = false; }
    dt *= +ts.value;
    for (const w of walkers) {
      const g = w.c.group, v = +spd.value;
      if (dt) {
        g.position.z += w.dir * v * dt;
        if (Math.abs(g.position.z) > LEN / 2) { g.position.z = Math.sign(g.position.z) * LEN / 2; w.dir = -Math.sign(g.position.z); }   // the end of the lane: turn round
        g.rotation.y = w.dir > 0 ? 0 : Math.PI;
        w.c.tick(dt, v);
      }
      v3.set(g.position.x, 2.35, g.position.z).project(camera);
      w.tag.style.display = v3.z < 1 ? "" : "none";
      w.tag.style.left = (v3.x + 1) / 2 * innerWidth + "px"; w.tag.style.top = (1 - v3.y) / 2 * innerHeight + "px";
    }
    controls.update(); renderer.render(scene, camera);
  });
</script>
</body></html>
