<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf8">
<title>VaultBuster</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">  <!-- the register terminal's font (pos.js) -->
<style>
  :root { --bb-blue: #00349c; --bb-blue-dark: #001f5c; --bb-yellow: #ffd400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000;
    font-family: Verdana, Geneva, sans-serif; user-select: none; }
  canvas { display: block; }

  /* ---------- title / pause screen ---------- */
  #titleScreen { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px; cursor: pointer;
    background: radial-gradient(ellipse at 50% 30%, #0b2a7a 0%, var(--bb-blue-dark) 55%, #000510 100%); }
  #logo { background: var(--bb-blue); border: 6px solid var(--bb-yellow); border-radius: 14px;
    padding: 26px 46px; transform: skewX(-8deg); box-shadow: 0 14px 50px #000c; }
  #logo h1 { font-family: "Arial Black", Arial, sans-serif; font-style: italic; font-weight: 900;
    color: var(--bb-yellow); font-size: clamp(40px, 9vw, 96px); letter-spacing: 2px;
    text-shadow: 3px 3px 0 #0008; }
  #logo .tag { color: #fff; text-align: center; font-weight: bold; font-size: clamp(12px, 1.8vw, 20px);
    letter-spacing: 5px; margin-top: 4px; }
  #enterHint { color: var(--bb-yellow); font-weight: bold; letter-spacing: 3px; font-size: 18px;
    animation: blink 1.4s infinite; text-shadow: 0 2px 6px #000; }
  #controlsHelp { color: #cfe0ff; font-size: 13px; line-height: 1.9; text-align: center;
    background: #0008; padding: 14px 22px; border-radius: 8px; }
  #controlsHelp b { color: var(--bb-yellow); }
  #controlsHelp .keys { display: grid; grid-template-columns: auto auto auto auto; gap: 4px 12px; align-items: baseline; }
  #controlsHelp .keys b { text-align: right; }
  #controlsHelp .keys span { text-align: left; margin-right: 18px; }
  #controlsHelp .more { margin-top: 8px; opacity: .8; font-size: 12px; }
  @keyframes blink { 50% { opacity: .25; } }
  #titleScreen.paused #enterHint { color: #fff; }
  /* resume screen (already played once) goes translucent so the still-running
     scene shows through behind it instead of hiding it; first-run intro stays opaque */
  #titleScreen.paused { background: rgba(3, 10, 30, .55); backdrop-filter: blur(1px); }

  /* ---------- HUD ---------- */
  #crosshair { position: fixed; z-index: 10; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px; border-radius: 50%; background: var(--bb-yellow); box-shadow: 0 0 4px #000;
    pointer-events: none; transition: opacity .5s; }
  body.idle #crosshair { opacity: 0; }     /* fades out after a few still seconds, back on the next move */
  #hoverTip { position: fixed; z-index: 10; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    background: var(--bb-blue); color: #fff; border: 2px solid var(--bb-yellow);
    padding: 6px 14px; border-radius: 4px; font-size: 13px; font-weight: bold; white-space: nowrap;
    pointer-events: none; display: none; text-shadow: 1px 1px 0 #0008; }
  #hoverTip .cat { color: var(--bb-yellow); font-weight: normal; font-size: 11px; }
  #holdingTag { position: fixed; z-index: 10; right: 14px; top: 14px; background: var(--bb-blue);
    color: #fff; border: 2px solid var(--bb-yellow); border-radius: 4px; padding: 8px 14px;
    font-size: 13px; font-weight: bold; display: none; max-width: 320px; }
  #holdingTag .h { color: var(--bb-yellow); font-size: 10px; letter-spacing: 2px; }
  #tvHint { position: fixed; z-index: 10; left: 50%; bottom: 64px; transform: translateX(-50%);
    color: #fff; background: var(--bb-blue); border: 2px solid var(--bb-yellow); border-radius: 4px;
    padding: 8px 16px; font-size: 13px; font-weight: bold; display: none; }

  /* ---------- held-up tape overlay ---------- */
  #inspect { position: fixed; z-index: 12; inset: 0; display: none; align-items: center;
    justify-content: center; background: #0007; pointer-events: none; }
  /* fixed 2:3 box, image fitted inside: the small embedded cover and the full-res
     one that swaps in after it render at the same size (zoom is a transform on top) */
  #inspect img { height: 36vh; width: 24vh; max-width: 92vw; object-fit: contain; background: #000; border: 4px solid #14181f;
    box-shadow: 0 24px 70px #000e; border-radius: 3px; transition: transform .12s ease-out; }

  /* ---------- one-line notices (e.g. shelving an unrewound tape) ---------- */
  #toast { position: fixed; z-index: 12; left: 50%; top: 18%; transform: translateX(-50%); display: none;
    background: #8c1c1c; color: #fff; border: 2px solid var(--bb-yellow); border-radius: 4px; padding: 8px 16px;
    font-size: 14px; font-weight: bold; white-space: nowrap; box-shadow: 0 6px 20px #000a; }
  body.nohud #toast { display: none !important; }

  /* ---------- inventory bar: shows once you carry 2+ things ---------- */
  #invBar { position: fixed; z-index: 11; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 6px; pointer-events: none; }
  #invBar .slot { position: relative; width: 58px; height: 58px; background: #ffffff40; border: 3px solid #ffffff40; border-radius: 4px;
    box-shadow: 0 2px 8px #0008; display: flex; align-items: center; justify-content: center; }
  #invBar .slot.sel { border-color: var(--bb-yellow); outline: 3px solid var(--bb-blue); transform: translateY(-4px); }
  #invBar .slot img { max-width: 46px; max-height: 50px; object-fit: contain; }
  #invBar .slot span { position: absolute; left: 3px; top: 1px; font: bold 10px Arial, sans-serif; color: #889; }
  /* tape wind bar: faint green = rewound, red fills in as far as it's played */
  #invBar .slot .wind { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 4px; border-radius: 2px;
    background: linear-gradient(to right, #e23232 var(--w), #3fcf6a80 var(--w)); }

  /* ---------- register terminal (pos.js): an 80x25 green-screen CRT ---------- */
  #posTerm { position: fixed; z-index: 30; inset: 0; display: flex; align-items: center; justify-content: center; background: #000c; }
  #posTerm[hidden] { display: none; }
  #posTerm pre { margin: 0; padding: 2.2vh 2.4vh; background: #0000aa; color: #c8c8d8; border: 14px solid #cfc7b2; border-radius: 18px;
    font: min(1.95vw, 3.7vh)/1.0 VT323, "Courier New", monospace; text-shadow: 0 0 4px #aab4ff66;
    box-shadow: inset 0 0 80px #000a, 0 20px 80px #000;
    background-image: repeating-linear-gradient(#0000 0 2px, #0002 2px 3px); }
  #posTerm .inv { background: #00aaaa; color: #000; text-shadow: none; }
  #posTerm .sel { background: #c8c8d8; color: #0000aa; text-shadow: none; }

  /* ---------- H toggles every HUD overlay off ---------- */
  body.nohud #nowPlaying, body.nohud #tvHint,
  body.nohud #hoverTip, body.nohud #holdingTag, body.nohud #invBar, body.nohud #crosshair { display: none !important; }

  /* ---------- now playing: quiet corner caption ---------- */
  #nowPlaying { position: fixed; z-index: 10; right: 16px; bottom: 12px; display: none;
    color: rgba(255, 255, 255, .72); font-size: 12px; max-width: 46vw; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="titleScreen">
  <div id="logo">
    <h1>VAULTBUSTER</h1>
    <div class="tag">WOW! WHAT A SELECTION.</div>
  </div>
  <div id="enterHint">CLICK TO ENTER THE STORE</div>
  <div id="controlsHelp">
    <div class="keys">
      <b>W A S D</b><span>move</span>      <b>MOUSE</b><span>look</span>
      <b>CLICK</b><span>grab</span>         <b>RIGHT-CLICK</b><span>put back</span>
      <b>E</b><span>interact</span>         <b>1–9 / WHEEL</b><span>switch items</span>
      <b>SHIFT</b><span>hustle</span>       <b>L</b><span>lights</span>
    </div>
    <div class="more">Most things do something. Poke around. &nbsp;·&nbsp; <b>ESC</b> menu</div>
  </div>
</div>

<div id="crosshair" hidden></div>
<div id="hoverTip"></div>
<div id="holdingTag"><div class="h">HOLDING</div><div id="holdingName"></div></div>
<div id="invBar"></div>
<div id="toast"></div>
<div id="tvHint"></div>
<div id="inspect"><img id="inspectArt" alt=""></div>

<div id="nowPlaying"></div>
<!-- TV picture menu's SHARPEN: unsharp-mask convolution the screen canvas filters
     through (kernel set by applyTv(), same as VaultVision's) -->
<svg width="0" height="0" style="position:absolute">
  <filter id="tvSharpen" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feConvolveMatrix id="tvSharpenMatrix" order="3" kernelMatrix="0 0 0 0 1 0 0 0 0" preserveAlpha="true"/>
  </filter>
</svg>

  <!-- off-screen decode source for the VideoTexture — never displayed, just sampled -->
  <video id="vid" crossorigin="anonymous" playsinline style="position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none;"></video>


<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="catalog.js"></script>
<script src="covers.js"></script>  <!-- built by fetch-covers.mjs -->
<script src="meta.js"></script>
<script src="monstervision.js"></script>  <!-- window.VAULT_MV: splits the MonsterVision tape into a tape per film -->
<script src="mv-covers.js"></script>    <!-- built by fetch-mv-covers.mjs: those films' TMDB posters -->
<script src="cutout.js"></script>       <!-- cutout.png, embedded: the Dracula standee -->    <!-- built by fetch-covers.mjs: [year, TMDB votes] per title -->
<script src="customers.js"></script>  <!-- window.VaultCustomers: TV-head customers, built from store.js -->
<script src="couch.js"></script>   <!-- window.buildCouch(); uses THREE lazily, called from store.js -->
<script src="pos.js"></script>     <!-- window.createPOS(); the register's terminal, created from store.js -->
<script type="module">
  // file:// can't load local files as ES modules, so: import three from the CDN
  // here (https CORS is fine), expose the globals, then load store.js as a
  // classic script — which file:// happily allows.
  import * as THREE from "three";
  import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
  import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
  window.THREE = THREE; window.mergeGeometries = mergeGeometries;
  window.EffectComposer = EffectComposer; window.RenderPass = RenderPass;
  window.UnrealBloomPass = UnrealBloomPass; window.ShaderPass = ShaderPass;
  window.OutputPass = OutputPass;
  const s = document.createElement("script"); s.src = "store.js";
  document.body.appendChild(s);
</script>
</body>
</html>
